# Continuous delivery: pushing a version tag (e.g. v1.0.1) builds the Windows installer and
# creates a DRAFT GitHub release with it. Nothing is published until you review the draft
# and press "Publish release".
#
#   1. bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# Re-run for an existing tag from the Actions tab (Run workflow → tag).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.0.1
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create the draft release

env:
  RUST_VERSION: "1.100.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  installer:
    name: Build the installer and draft the release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: release
      - run: npm ci
      - name: The tag matches the app version everywhere
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $crate = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "tag $env:TAG, package.json $pkg, tauri.conf.json $conf, Cargo.toml $crate"
          if ("v$pkg" -ne $env:TAG -or $pkg -ne $conf -or $pkg -ne $crate) { throw "The tag and the three version numbers must match." }
      - name: Unit and integration tests
        run: |
          npm run test:ui
          cargo test --manifest-path src-tauri/Cargo.toml --features test-support
      - name: Build the installer (release, no test code)
        run: npm run build
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          "$($exe.Name): $([math]::Round($exe.Length / 1MB, 2)) MiB, sha256 $hash"
          gh release create $env:TAG $exe.FullName "$($exe.FullName).sha256" --draft --verify-tag --generate-notes --title "Sidekick $($env:TAG.TrimStart('v'))"
