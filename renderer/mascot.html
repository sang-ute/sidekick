<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" />
  <title>Sidekick mascot</title>
  <link rel="stylesheet" href="/mascot.css" />
</head>
<body>
  <!-- Notifier: a chat-bubble mini dashboard above the mascot -->
  <section id="notifier" class="notifier" aria-live="polite" hidden>
    <header class="n-head">
      <svg class="n-avatar" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13" r="10" class="n-avatar-body" />
        <circle cx="8.6" cy="12.5" r="1.6" class="n-avatar-eye" />
        <circle cx="15.4" cy="12.5" r="1.6" class="n-avatar-eye" />
        <path d="M19 1.5 Q19.5 4.5 22.5 5 Q19.5 5.5 19 8.5 Q18.5 5.5 15.5 5 Q18.5 4.5 19 1.5Z" class="n-avatar-spark" />
      </svg>
      <strong class="n-name">Sidekick</strong>
      <span id="nStatus" class="n-status"></span>
      <button id="nGear" class="n-icon" type="button" title="Settings" aria-label="Settings">⚙</button>
      <button id="nClose" class="n-icon" type="button" title="Hide" aria-label="Hide">×</button>
    </header>

    <p id="nLine" class="n-line" hidden></p>

    <div class="n-stats">
      <button id="chipTasks" class="chip" type="button" title="Open tasks">📌 <b id="statTasks">0</b> <span id="statTasksLabel">tasks</span></button>
      <span class="chip" title="Next reminder">⏰ <b id="statReminder">none</b></span>
      <span class="chip" title="Last sync">🔄 <b id="statSync">never</b></span>
    </div>

    <ul id="nList" class="n-list"></ul>
    <p id="nEmpty" class="n-empty">No notifications yet. I'll pin news here.</p>

    <footer class="n-foot">
      <button id="nOpen" class="n-btn primary" type="button">Open chat</button>
      <button id="nClear" class="n-btn" type="button">Clear</button>
    </footer>
  </section>

  <div id="pet" class="pet idle" title="Click to chat · drag to move · right-click for menu">
    <svg viewBox="0 0 120 124" width="120" height="124" aria-hidden="true">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#8fd0ff" />
          <stop offset="1" stop-color="#2f7fd8" />
        </linearGradient>
        <linearGradient id="sparkFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#cfe8ff" />
        </linearGradient>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#e6f9ff" />
          <stop offset="1" stop-color="#9fe3ff" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="bellFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe28a" />
          <stop offset="1" stop-color="#f2b632" />
        </linearGradient>
      </defs>

      <ellipse class="shadow" cx="60" cy="117" rx="30" ry="5" />

      <g class="body">
        <!-- legs -->
        <rect class="leg legL" x="40" y="96" width="12" height="14" rx="6" />
        <rect class="leg legR" x="68" y="96" width="12" height="14" rx="6" />
        <!-- arms -->
        <ellipse class="arm armL" cx="20" cy="74" rx="7" ry="11" />
        <ellipse class="arm armR" cx="100" cy="74" rx="7" ry="11" />

        <!-- antenna -->
        <path class="stem" d="M60 34 Q58 24 62 16" />
        <g class="waves">
          <circle cx="62" cy="14" r="9" /><circle cx="62" cy="14" r="9" /><circle cx="62" cy="14" r="9" />
        </g>
        <g class="data">
          <circle cx="62" cy="14" r="2.3" /><circle cx="62" cy="14" r="2" />
          <circle cx="62" cy="14" r="2.3" /><circle cx="62" cy="14" r="1.8" />
        </g>
        <circle class="spark-glow" cx="62" cy="14" r="13" fill="url(#glow)" />
        <path class="spark" fill="url(#sparkFill)" d="M62 4 Q63.6 12.4 72 14 Q63.6 15.6 62 24 Q60.4 15.6 52 14 Q60.4 12.4 62 4Z" />

        <!-- body -->
        <rect x="18" y="32" width="84" height="72" rx="32" fill="url(#skin)" />
        <ellipse class="belly" cx="60" cy="86" rx="24" ry="13" />

        <!-- face -->
        <g class="eyes">
          <g class="eye"><ellipse cx="46" cy="62" rx="6.5" ry="8.5" /><circle class="shine" cx="48.5" cy="58.5" r="2.4" /></g>
          <g class="eye"><ellipse cx="74" cy="62" rx="6.5" ry="8.5" /><circle class="shine" cx="76.5" cy="58.5" r="2.4" /></g>
          <path class="lid lidL" d="M39 63 Q46 68 53 63" />
          <path class="lid lidR" d="M67 63 Q74 68 81 63" />
        </g>
        <ellipse class="cheek" cx="35" cy="75" rx="6" ry="3.5" />
        <ellipse class="cheek" cx="85" cy="75" rx="6" ry="3.5" />
        <path class="mouth smile" d="M54 76 Q60 82 66 76" />
        <ellipse class="mouth talk" cx="60" cy="79" rx="4.5" ry="3.5" />
        <path class="mouth sad" d="M55 80 Q60 75 65 80" />
        <ellipse class="mouth oh" cx="60" cy="79" rx="3" ry="3.6" />

        <!-- reminder bell, held in the right hand -->
        <g class="bell">
          <circle cx="115" cy="57" r="2.2" class="bell-ring-top" />
          <path d="M107 70 Q107 60 115 60 Q123 60 123 70 L125 73 L105 73 Z" fill="url(#bellFill)" class="bell-body" />
          <circle cx="115" cy="75.5" r="2" class="bell-clapper" />
        </g>
        <g class="rings">
          <path d="M128 60 Q132 66 128 72" /><path d="M132 56 Q138 66 132 76" />
        </g>
      </g>

      <!-- "!" pop for reminders -->
      <g class="exclaim">
        <circle cx="22" cy="14" r="9" />
        <rect x="20.6" y="8" width="2.8" height="7.4" rx="1.4" />
        <circle cx="22" cy="18.8" r="1.6" />
      </g>

      <g class="zzz"><text x="88" y="30">z</text><text x="98" y="18">z</text></g>
      <g class="dots"><circle cx="86" cy="22" r="3" /><circle cx="96" cy="16" r="3" /><circle cx="106" cy="10" r="3" /></g>
    </svg>
    <!-- custom skin: drop mascot.png / .gif / .webp into the data folder -->
    <img id="skin" class="skin" alt="" hidden />
    <button id="tasksBadge" class="tasks-badge" type="button" title="Show notifications" hidden></button>
  </div>

  <script src="/mascot.js"></script>
</body>
</html>
