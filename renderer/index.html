<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" />
  <title>Sidekick</title>
  <link rel="icon" href="/icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Collapsed (desktop bubble only) -->
  <button id="bubble" class="bubble" title="Sidekick (Ctrl+Shift+Space)" aria-label="Open Sidekick">
    <span class="face"><i></i><i></i></span>
    <span id="badge" class="badge" hidden></span>
  </button>

  <!-- Expanded panel -->
  <section id="panel" class="panel" hidden>
    <header class="head">
      <div class="title">
        <span id="dot" class="dot"></span>
        <div>
          Sidekick
          <small id="status" class="status">connecting…</small>
        </div>
      </div>
      <div class="actions">
        <button id="btnReminders" title="Reminders" aria-label="Reminders">⏰</button>
        <button id="btnNew" title="New chat" aria-label="New chat">＋</button>
        <button id="btnClose" title="Collapse (Esc)" aria-label="Collapse">—</button>
      </div>
    </header>

    <div id="missingView" class="view info" hidden>
      <h2>Claude Code not found</h2>
      <p>Sidekick runs on your Claude Code login. Install Claude Code, run <code>claude</code> once in a terminal to sign in, then restart Sidekick from the tray.</p>
    </div>

    <div id="chatView" class="view chat">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <textarea id="chatInput" rows="1" placeholder="Message Sidekick…"></textarea>
        <button id="sendBtn" type="submit" aria-label="Send">➤</button>
      </form>
    </div>

    <div id="remView" class="view info" hidden>
      <h2>Reminders</h2>
      <ul id="remList"></ul>
      <p id="remEmpty" class="muted">Nothing scheduled. Ask in chat: “remind me tomorrow at 9 to apply to …”.</p>
      <button id="remBack" class="link">← Back to chat</button>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
